<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>merge card repro</title>
<link id="sheet" rel="stylesheet" href="git.css">
<style>
  /* Stand-ins for the Harness theme tokens the panel reads (values sampled from
     the installed app.asar theme). */
  :root{
    --dsw-alias-bg-base:#ffffff;
    --dsw-alias-bg-layer-1:#f5f5f5;
    --dsw-alias-bg-layer-2:#ebebeb;
    --dsw-alias-label-primary:#161616;
    --dsw-alias-label-secondary:#5b5b5b;
    --dsw-alias-label-tertiary:#8b8b8b;
    --dsw-alias-label-primary-inverted:#ffffff;
    --dsw-alias-label-on-color:#ffffff;
    --dsw-alias-border-l1:#d8d8d8;
    --dsw-alias-border-l3:#e4e4e4;
    --dsw-alias-brand-primary:#0d0d0d;
    --dsw-alias-state-success-primary:#1a7f37;
    --dsw-alias-state-warn-primary:#9a6700;
    --dsw-alias-state-error-primary:#cf222e;
  }
  html[data-theme=dark]{
    --dsw-alias-bg-base:#15171a;
    --dsw-alias-bg-layer-1:#1e2126;
    --dsw-alias-bg-layer-2:#262a30;
    --dsw-alias-label-primary:#f2f4f7;
    --dsw-alias-label-secondary:#a8b0bd;
    --dsw-alias-label-tertiary:#7d8794;
    --dsw-alias-label-primary-inverted:#2b3038;
    --dsw-alias-label-on-color:#ffffff;
    --dsw-alias-border-l1:#ffffff1f;
    --dsw-alias-border-l3:#ffffff29;
    --dsw-alias-brand-primary:#f2f4f7;
    --dsw-alias-state-success-primary:#3fb950;
    --dsw-alias-state-warn-primary:#d29922;
    --dsw-alias-state-error-primary:#f85149;
  }
  body{margin:0;background:var(--dsw-alias-bg-base)}
  #stage{width:620px;padding:12px}
</style>
<script>
  const q = new URLSearchParams(location.search)
  document.documentElement.dataset.theme = q.get('theme') || 'light'
  if (q.get('css')) document.getElementById('sheet').href = q.get('css')
</script>
</head>
<body>
<div id="stage">
  <div class="ph-git" style="height:auto">
    <div class="ph-card ph-merge">
      <div class="ph-card-title">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="4" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="11" cy="8" r="2"/><path d="M5 6v4M7 8h2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        Merge pull request #922
      </div>
      <p class="ph-hint">Merge dsh-81e17efa-c3ee into main?</p>
      <div class="ph-merge-actions">
        <button type="button" class="ph-primary">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="4" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="11" cy="8" r="2"/><path d="M5 6v4M7 8h2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          Merge
        </button>
        <button type="button" class="ph-button">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          Squash &amp; merge
        </button>
        <button type="button" class="ph-button">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          Rebase &amp; merge
        </button>
        <button type="button" class="ph-primary" disabled>Merging…</button>
        <button type="button" class="ph-primary ph-danger">Discard all</button>
        <button type="button" class="ph-filter" aria-pressed="true">Open</button>
        <span class="ph-chip" data-tone="success"><span class="ph-dot" data-state="open"></span>Open</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
